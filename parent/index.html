<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="frame">
    <div class="hero" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></span>
        <span>Beacon</span>
      </div>
      <button id="sign-out" class="me" type="button" hidden aria-label="Sign out"></button>
    </header>

    <!-- Sign in with the parent's mobile -->
    <section id="signin" class="signin" hidden>
      <h1 class="signin-title">See your child's bus ride live</h1>
      <p class="signin-sub">Sign in with the mobile number you gave in your child's Beacon Go app.</p>
      <form id="signin-form" class="card form" novalidate>
        <div class="field">
          <label for="phone">Your mobile</label>
          <div class="phone-row">
            <span class="prefix">+91</span>
            <input id="phone" type="tel" inputmode="numeric" maxlength="16" placeholder="98765 43210" autocomplete="tel-national">
          </div>
        </div>
        <div id="code-field" class="field" hidden>
          <label for="code">OTP</label>
          <input id="code" class="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
        </div>
        <p id="signin-status" class="status-line" aria-live="polite"></p>
        <div id="recaptcha"></div>
        <button id="signin-btn" class="primary-btn" type="submit">Send OTP</button>
      </form>
    </section>

    <!-- Live map + family list -->
    <section id="home" class="home" hidden>
      <div id="alert" class="alert" role="alert" hidden>
        <div class="alert-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg></div>
        <div class="alert-text"><strong id="alert-title"></strong><span id="alert-sub"></span></div>
        <button id="alert-view" class="alert-btn" type="button">View</button>
        <button id="alert-close" class="alert-close" type="button" aria-label="Dismiss">×</button>
      </div>
      <div class="map-card">
        <div id="map" class="map" aria-label="Live map of your children"></div>
        <button id="recenter" class="recenter" type="button" aria-label="Show all children on the map">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
      <div class="family">
        <div class="family-head">
          <span>Family</span>
          <span class="family-tools">
            <button id="alerts-btn" class="alerts-btn" type="button" hidden>Turn on alerts</button>
            <span id="live-dot" class="live-dot">Live</span>
          </span>
        </div>
        <ul id="family-list" class="family-list"></ul>
        <p id="family-note" class="family-note" hidden></p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
