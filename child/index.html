<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="frame">
    <div class="hero" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
    </div>

    <!-- Tracker tab -->
    <section id="panel-tracker" class="panel" role="tabpanel" aria-labelledby="tab-tracker">
      <div class="tracker" aria-live="polite">
        <div class="ring">
          <div class="pulse" aria-hidden="true"></div>
          <div class="pulse pulse-2" aria-hidden="true"></div>
          <div class="ring-bg"></div>
          <div class="ring-core">
            <svg class="status-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          </div>
        </div>

        <div class="status">
          <div id="status-title" class="status-title">Sharing your location</div>
          <div id="status-subtitle" class="status-subtitle">Updated just now · Your parents can see where you are</div>
        </div>

        <button id="toggle-btn" class="toggle-btn" type="button" aria-pressed="true">Pause sharing</button>
      </div>

      <div class="info">
        <div class="info-row">
          <div class="info-label">
            <span class="info-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/></svg></span>
            <span>Battery</span>
          </div>
          <span id="battery-value" class="info-value">82%</span>
        </div>
        <div class="info-row">
          <div class="info-label">
            <span class="info-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span>Visible to</span>
          </div>
          <span class="info-value"><span id="bus-chip" class="chip">Bus No. 1</span> Parents</span>
        </div>
      </div>
    </section>

    <!-- Child Details tab -->
    <section id="panel-children" class="panel" role="tabpanel" aria-labelledby="tab-children" hidden>
      <h1 class="panel-title">Child Details</h1>
      <p class="panel-sub">Add each child with their bus and two parent mobile numbers.</p>

      <div class="card bus-count">
        <div>
          <div class="bus-count-label">Buses in school</div>
          <div class="bus-count-hint">Children can be added to any of these buses.</div>
        </div>
        <div class="stepper">
          <button id="bus-minus" class="step-btn" type="button" aria-label="Fewer buses">−</button>
          <span id="bus-count" class="step-value" aria-live="polite">1</span>
          <button id="bus-plus" class="step-btn" type="button" aria-label="More buses">+</button>
        </div>
      </div>

      <form id="child-form" class="card form" autocomplete="off" novalidate>
        <label class="field">
          <span>Child name</span>
          <input id="child-name" name="name" type="text" placeholder="e.g. Aarav Sharma" required>
        </label>
        <label class="field">
          <span>Bus</span>
          <select id="child-bus" name="bus"></select>
        </label>
        <label class="field">
          <span>Mobile number 1</span>
          <input id="child-mobile1" name="mobile1" type="tel" inputmode="tel" placeholder="e.g. 98765 43210" required>
        </label>
        <label class="field">
          <span>Mobile number 2</span>
          <input id="child-mobile2" name="mobile2" type="tel" inputmode="tel" placeholder="e.g. 91234 56789" required>
        </label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button class="add-btn" type="submit">Add child</button>
      </form>

      <div class="list-head">
        <span>Children</span>
        <span id="child-count" class="count">0</span>
      </div>
      <div id="child-list" class="child-groups"></div>
      <p id="empty-state" class="empty">No children added yet.</p>
    </section>

    <nav class="tabbar" role="tablist">
      <button id="tab-tracker" class="tab is-active" role="tab" aria-selected="true" aria-controls="panel-tracker" data-panel="panel-tracker" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Tracker
      </button>
      <button id="tab-children" class="tab" role="tab" aria-selected="false" aria-controls="panel-children" data-panel="panel-children" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        Child Details
      </button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
