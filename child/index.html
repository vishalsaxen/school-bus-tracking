<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Go — Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="frame">

    <header class="brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="#fff"/></svg>
      </div>
      <div class="brand-name">Beacon Go</div>
    </header>

    <section class="tracker" aria-live="polite">
      <div class="ring">
        <div id="ring-bg" class="ring-bg"></div>
        <div class="ring-core">
          <svg id="status-icon" class="status-icon" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        </div>
      </div>

      <div class="status">
        <div id="status-title" class="status-title">Sharing your location</div>
        <div id="status-subtitle" class="status-subtitle">Updated just now · Mom can see where you are</div>
      </div>

      <button id="toggle-btn" class="toggle-btn" type="button" aria-pressed="true">Pause sharing</button>
    </section>

    <section class="info">
      <div class="info-row">
        <div class="info-label">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/></svg>
          <span>Battery</span>
        </div>
        <span id="battery-value" class="info-value">82%</span>
      </div>
      <div class="info-row">
        <div class="info-label">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Visible to</span>
        </div>
        <span id="visible-to-value" class="info-value">Mom, Dad</span>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
