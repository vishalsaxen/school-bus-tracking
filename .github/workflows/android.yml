name: Android app

# Builds the Beacon Go Android app. On main it also publishes the APK as the latest release,
# so https://github.com/vishalsaxen/school-bus-tracking/releases/latest/download/beacon-go.apk
# always installs the newest version.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk beacon-go.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beacon-go-apk
          path: android/beacon-go.apk

      - name: Publish as latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="beacon-go-v1.0.${{ github.run_number }}"
          gh release create "$tag" android/beacon-go.apk \
            --title "Beacon Go Android app 1.0.${{ github.run_number }}" \
            --notes "Install on the child's phone: open this page on the phone, tap beacon-go.apk, and allow installing from this source." \
            --latest
