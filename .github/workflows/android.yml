name: Android app

# Builds the Bus Captain Android app. On main it also publishes the APK as the latest release,
# so https://github.com/vishalsaxen/school-bus-tracking/releases/latest/download/bus-captain.apk
# always installs the newest version.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          # On failure, surface the errors as annotations so they show on the PR's checks page.
          if ! ./gradlew --no-daemon assembleRelease > build.log 2>&1; then
            grep -E "error|What went wrong|FAILED|Exception|\.java:[0-9]+|\.xml:[0-9]+" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 build.log
            exit 1
          fi
          tail -5 build.log
          cp app/build/outputs/apk/release/app-release.apk bus-captain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bus-captain-apk
          path: android/bus-captain.apk

      - name: Publish as latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bus-captain-v1.0.${{ github.run_number }}"
          gh release create "$tag" android/bus-captain.apk \
            --title "Bus Captain Android app 1.0.${{ github.run_number }}" \
            --notes "Install on the Bus Captain's phone: open this page on the phone, tap bus-captain.apk, and allow installing from this source." \
            --latest
